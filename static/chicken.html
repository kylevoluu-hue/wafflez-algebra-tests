<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title>Chicken Butt Bot</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --bot: #2a2f3e;
      --user: #4c6ef5;
      --text: #e8eaf0;
      --muted: #8b90a0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat {
      width: min(540px, 94vw);
      height: min(720px, 92vh);
      background: var(--panel);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #f5a623, #f76b1c);
      color: #1a1207;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header small {
      font-weight: 500;
      opacity: 0.75;
      font-size: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: pop 0.18s ease;
    }

    @keyframes pop {
      from {
        transform: translateY(6px);
        opacity: 0;
      }
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #2a2f3e;
    }

    .form input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #313646;
      background: #11131a;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .form input:focus {
      border-color: var(--user);
    }

    .form button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f5a623, #f76b1c);
      color: #1a1207;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .form button:active {
      transform: scale(0.96);
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #313646;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="chat">
    <div class="header">
      🐔 Chicken Butt Bot
      <small>say "what" and find out</small>
    </div>
    <div class="messages" id="messages"></div>
    <form class="form" id="form" autocomplete="off">
      <input id="input" placeholder="Type something with 'what' in it..." />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function addMessage(text, who) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    // Matches the word "what" anywhere in the sentence (whatever, somewhat, etc. count too).
    function mentionsWhat(text) {
      return /what/i.test(text);
    }

    function botReply(userText) {
      if (mentionsWhat(userText)) {
        return "Chicken butt! 🐔";
      }
      const fallbacks = [
        "Go on, say \"what\"... I dare you. 😏",
        "You haven't said the magic word yet.",
        "Hmm. Try asking me \"guess what?\"",
        "I only really know one joke. Give me a \"what\".",
      ];
      return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      const reply = botReply(text);
      setTimeout(() => addMessage(reply, "bot"), 350);
    });

    addMessage("Hey! I'm the Chicken Butt Bot. Say \"what\" anywhere in a sentence and watch what happens. 🐔", "bot");
  </script>
</body>

</html>
